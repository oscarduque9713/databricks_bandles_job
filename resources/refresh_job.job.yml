# The main pipeline for test_bandles

resources:
  jobs:
    refresh_job:
      name : refresh_job

      trigger:
        periodic:
          interval : 1
          unit : DAYS

      parameters :
        - name : catalog 
          default: ${var.catalog}
        - name : schema
          default: ${var.schema}

      

  pipelines:
    test_bandles_etl:
      name: test_bandles_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/test_bandles_etl"

      libraries:
        - glob:
            include: ../src/test_bandles_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}

# This is a Databricks asset bundle definition for test_bandles.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: test_bandles
  uuid: 0ae7a385-64e3-46b4-b45f-f0d5ca4ed1fb

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-94d97175-1f32.cloud.databricks.com
    variables:
      catalog: project_pipeline
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-94d97175-1f32.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ospina.oscard13@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ospina.oscard13@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: project_pipeline
      schema: prod
    permissions:
      - user_name: ospina.oscard13@gmail.com
        level: CAN_MANAGE

# This is a Databricks asset bundle definition for test_bandles.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my-databricks-project

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: Unity catalog for pipeline
    default: main
  schema:
    description: The schema to use
    default: default

# Default workspace
workspace:
  host: https://dbc-94d97175-1f32.cloud.databricks.com/

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    #workspace:
      #host: https://dbc-94d97175-1f32.cloud.databricks.com
    presets:
      name_prefix: "[dev ${workspace.current_user.short_name}]"
    variables:
      catalog: dev
      schema: dev
  
  stg:
    mode: production
    workspace:
      # host
      file_path: /Workspace/${bundle.target}/{bundle.name}/
      root_path: /Workspace/${bundle.target}/{bundle.name}/.bundle/
    presets: 
      name_prefix: "[stg] "
    variables:
      catalog : stg
      schema: stg
  
